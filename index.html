 <div class="two"><div class="card"><h2>Top scorers</h2>${bars(rows,'g')}</div><div class="card"><h2>Appearances</h2>${bars(rows,'a')}</div>
 <div class="card"><h2>Goals per appearance <span class="mut">(min 3 apps)</span></h2>${bars(rows.filter(o=>o.a>=3),'r',f2)}</div></div>
 ${fixtures(s)}<div class="card"><h2>League table</h2>${table(rows.filter(o=>o.a||o.g),true,games)}</div>`}
function allView(){const ss=seasons(),{rows,games}=stats(ss),q=rows.filter(o=>o.a>=minApps);let hg={g:0},ht=0,bg=null;
 ss.forEach(s=>s.g.forEach(g=>{const k=g.p.reduce((a,p)=>a+p[1],0);if(!bg||k>bg.k)bg={k,d:g.d};g.p.forEach(p=>{if(p[1]>hg.g)hg={g:p[1],n:p[0],d:g.d};if(p[1]>=3)ht++})}));
 const per=ss.map(s=>stats([s]));const pn=prof||[...rows].sort((a,b)=>b.a-a.a)[0].n;const ps=ss.map((s,i)=>per[i].rows.find(o=>o.n==pn)||{a:0,g:0});const po=rows.find(o=>o.n==pn);
 const win=(k)=>ss.map((s,i)=>{const t=[...per[i].rows].sort((a,b)=>b[k]-a[k])[0];return t?`<div class="g1"><span>Season ${s.n}</span><span><b>${esc(t.n)}</b> · ${t[k]}</span></div>`:''}).join('');
 return `<div class="kpis">${kpi(games,'Games played')}${kpi(rows.reduce((a,o)=>a+o.g,0),'Goals scored')}${kpi(rows.length,'Players used')}${kpi(ht,'Hat-tricks')}${kpi(hg.g,'Most in a game<br>'+esc(hg.n||''))}${kpi(bg?bg.k:0,'Team best, one game')}</div>
 <div class="row" style="margin-bottom:10px"><span class="mut">Min appearances</span><select onchange="minApps=+this.value;draw()">${[1,5,10,20,40].map(n=>`<option ${n==minApps?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="two"><div class="card"><h2>🥇 All-time scorers</h2>${bars(rows,'g')}</div><div class="card"><h2>💪 All-time appearances</h2>${bars(rows,'a')}</div>
 <div class="card"><h2>🎯 Strike rate (goals/game)</h2>${bars(q,'r',f2)}</div><div class="card"><h2>🎩 Hat-trick heroes</h2>${bars(rows.filter(o=>o.hat),'hat')||''}</div>
 <div class="card"><h2>Goals per season</h2>${cols(per.map(p=>p.rows.reduce((a,o)=>a+o.g,0)),ss.map(s=>'S'+s.n))}</div><div class="card"><h2>Games per season</h2>${cols(ss.map(s=>s.g.length),ss.map(s=>'S'+s.n))}</div>
 <div class="card"><h2>Golden Boot winners</h2>${win('g')}</div><div class="card"><h2>Most apps winners</h2>${win('a')}</div></div>
 <div class="card"><h2>Player profile</h2><select onchange="prof=this.value;draw()">${rows.map(o=>o.n).sort().map(n=>`<option ${n==pn?'selected':''}>${esc(n)}</option>`).join('')}</select>
 <div class="kpis" style="margin-top:12px">${kpi(po.a,'Appearances')}${kpi(po.g,'Goals')}${kpi(f2(po.r),'Goals / game')}</div>
 <div class="two"><div><h3>Goals by season</h3>${cols(ps.map(p=>p.g),ss.map(s=>'S'+s.n))}</div><div><h3>Apps by season</h3>${cols(ps.map(p=>p.a),ss.map(s=>'S'+s.n))}</div></div></div>
 <div class="card"><h2>Full all-time table</h2>${table(rows,false,games)}</div>`}
function draw(){$('#app').innerHTML=(tab=='m'?matchDay():tab=='s'?seasonView():tab=='o'?oppView():allView())+(tab=='s'||tab=='o'?repModal():'');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
function tg(n){pick.has(n)?pick.delete(n):pick.set(n,0);draw()}
function gg(n,d){pick.set(n,Math.max(0,(pick.get(n)||0)+d));draw()}
function addP(){const v=$('#np').value.trim();if(!v)return;pick.set(v,0);draw()}
const GH='https://api.github.com',b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
function persist(){}
function repoInfo(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean),o=h.endsWith('.github.io')?h.split('.')[0]:'';return{owner:o,repo:p[0]&&!p[0].includes('.')?p[0]:(o?o+'.github.io':'')}}
async function ckey(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function mkCfgData(owner,repo,branch,token,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(pw,salt),new TextEncoder().encode(token));return{owner,repo,branch,s:b64(salt),i:b64(iv),c:b64(ct)}}
async function makeCfg(){const v=i=>$('#'+i).value.trim();if(!v('so')||!v('sr')||!v('sb')||!v('st')||v('sp').length<8){msg='Fill every box (passcode 8+ characters)';return draw()}
 const o=await mkCfgData(v('so'),v('sr'),v('sb'),v('st'),v('sp')),t=JSON.stringify(o,null,1);msg='';draw();const x=$('#cj');x.style.display='block';x.value=t;
 const a=$('#dl');a.style.display='inline-block';a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}))}
async function unlockWith(pw){const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(cfg.i)},await ckey(pw,ub(cfg.s)),ub(cfg.c));return new TextDecoder().decode(t)}
async function unlock(){try{tok=await unlockWith($('#pw').value);try{sessionStorage.setItem('5oh5t',tok)}catch(e){}canW=true;msg='';await loadGames()}catch(e){msg='Wrong passcode';tok=null}draw()}
function lock(){tok=null;canW=false;try{sessionStorage.removeItem('5oh5t')}catch(e){}draw()}
async function loadCfg(){try{const r=await fetch('config.json?'+Date.now());if(r.ok)cfg=await r.json()}catch(e){}}
async function loadFile(name){let t=null;try{if(cfg){const r=await fetch(`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${name}?ref=${cfg.branch}&t=${Date.now()}`,{headers:{Accept:'application/vnd.github.raw'}});if(r.ok)t=await r.text()}}catch(e){}
 if(t==null)try{const r=await fetch(name+'?'+Date.now());if(r.ok)t=await r.text()}catch(e){}
 try{return t?JSON.parse(t):null}catch(e){return null}}
async function loadGames(){const a=await loadFile('games.json');if(Array.isArray(a))extra=a;const b=await loadFile('reports.json');if(Array.isArray(b))UR=b}
async function pubTo(file,data){try{const u=`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${file}`,h={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};let sha;
 const g=await fetch(u+'?ref='+cfg.branch+'&t='+Date.now(),{headers:h});if(g.ok)sha=(await g.json()).sha;else if(g.status==401||g.status==403)throw 'token rejected or expired';
 const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'Update '+file,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1)))),branch:cfg.branch,sha})});
 if(!r.ok)throw 'GitHub replied '+r.status;return true}catch(e){return String(e)}}
async function pub(){msg='Saving...';draw();const r=await pubTo('games.json',extra);if(r===true){msg='';return true}msg='Could not save: '+r;draw();return false}
function lockView(){const ri=repoInfo();const setup=`<details ${cfg?'':'open'} style="margin-top:12px"><summary class="mut" style="cursor:pointer">Owner setup (first time, or to change the passcode)</summary>
 <p class="mut">Enter your GitHub details, a fine-grained token (Contents: read and write on this repo only) and a new passcode. Nothing is sent anywhere except GitHub when you log a game.</p>
 <div class="row"><input id="so" placeholder="GitHub username" value="${esc(ri.owner)}"><input id="sr" placeholder="Repo name" value="${esc(ri.repo)}"><input id="sb" placeholder="Branch" value="main"></div>
 <div class="row" style="margin-top:8px"><input id="st" type="password" placeholder="GitHub token" style="flex:1;min-width:160px"><input id="sp" type="password" placeholder="New passcode (8+ chars)"><button class="b" onclick="makeCfg()">Create config</button></div>
 <textarea id="cj" style="display:none;width:100%;height:150px;margin-top:8px"></textarea><a id="dl" download="config.json" class="b" style="display:none;margin-top:8px;padding:8px 12px;border-radius:8px;text-decoration:none;background:var(--ac);color:#000;font-weight:600">⬇ Download config.json</a>
 <p class="mut">Upload config.json to the top level of your repo, then reload this page.</p></details>`;
 return `<div class="card"><h2>🔒 Match Day</h2>${cfg?`<p class="mut">Enter the passcode to log games.</p><div class="row"><input id="pw" type="password" placeholder="Passcode" onkeydown="if(event.key=='Enter')unlock()"><button class="b" onclick="unlock()">Unlock</button><span class="mut">${esc(msg)}</span></div>`:'<p class="mut">Logging games isn\'t set up yet.</p>'}${setup}<span class="mut">${cfg?'':esc(msg)}</span></div>`}
async function save(){if(!pick.size){msg='Tick at least one player';return draw()}const id=edit?edit.id:'g'+Date.now(),sel=+(sSel??seasons().slice(-1)[0].n);
 const o={id,date:$('#dt').value,season:sel,pj:JSON.stringify([...pick.entries()])};extra=extra.filter(e=>e.id!=id).concat(o);persist();
 if(!await pub())return;
 pick=new Map();edit=null;msg=msg||'✅ Game saved!';draw();msg=''}
function ed(id){const e=extra.find(x=>x.id==id);edit=e;sSel=e.season;pick=new Map(JSON.parse(e.pj));draw();scrollTo(0,0)}
async function del(id){if(!confirm('Delete this game?'))return;extra=extra.filter(e=>e.id!=id);await pub();draw()}
async function csv(){let c='season,date,player,goals\n';seasons().forEach(s=>s.g.forEach(g=>g.p.forEach(p=>c+=`${s.n},${g.d},"${p[0]}",${p[1]}\n`)));
 try{const d=await claude.use('downloads');if(d){await d.save({filename:'5oh5-all-games.csv',data:c});return}}catch(e){}const t=$('#ex');t.style.display='block';t.value=c;t.select()}
draw();
(async()=>{await loadCfg();try{tok=sessionStorage.getItem('5oh5t');canW=!!(tok&&cfg)}catch(e){}await loadGames();draw()})();
</script></body></html>
