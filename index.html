<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>5OH!5 Stats HQ</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style id="css">
:root{color-scheme:light;--bg:#f6f6f3;--card:#fff;--tx:#14120a;--mut:#6b6650;--ac:#e1ad01;--ac2:#b88a00;--ln:#e3e0d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ac);border-bottom:3px solid #000;color:#000;padding:16px 16px 0}
h1{margin:0;font-size:26px;letter-spacing:1px}h1 small{display:block;font-size:12px;font-weight:400;opacity:.85;letter-spacing:0}
nav{display:flex;gap:4px;margin-top:12px}nav button{flex:1;background:none;border:0;color:#000;opacity:.7;padding:10px 4px;font:600 14px inherit;border-bottom:3px solid transparent;cursor:pointer}nav button.on{opacity:1;border-color:#000}
main{max-width:900px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px}h3{margin:14px 0 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button.b{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
button.b{background:var(--ac);color:#000;border:0;font-weight:600;cursor:pointer}button.g{background:none !important;color:var(--tx) !important;border:1px solid var(--ln)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;cursor:pointer;user-select:none}
.pl.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}.pl input{width:18px;height:18px;accent-color:var(--ac)}
.pl .n{flex:1}.st{display:none;align-items:center;gap:4px}.pl.on .st{display:flex}.st button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}.st b{min-width:18px;text-align:center}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap}
.wrap{overflow-x:auto}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--tx)}.kpi span{font-size:12px;color:var(--mut)}
.bar{display:grid;grid-template-columns:100px 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:13px}.bar i{display:block;height:16px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--ac2))}.bar b{text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.mut{color:var(--mut);font-size:13px}.tag{display:inline-block;background:var(--ac);color:#000;border-radius:6px;padding:1px 7px;font-size:12px;margin-left:4px}
.g1{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}svg text{fill:var(--mut);font-size:10px}

function draw(){$('#app').innerHTML=tab=='m'?matchDay():tab=='s'?seasonView():allView();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
function tg(n){pick.has(n)?pick.delete(n):pick.set(n,0);draw()}
function gg(n,d){pick.set(n,Math.max(0,(pick.get(n)||0)+d));draw()}
function addP(){const v=$('#np').value.trim();if(!v)return;pick.set(v,0);draw()}
const RE=/\/\*XS\*\/[\s\S]*?\/\*XE\*\//;
function persist(){}
function mk(){const j=document.getElementById('js').textContent.replace(RE,()=>'/*XS*/'+JSON.stringify(extra).replace(/</g,'\\u003c')+'/*XE*/');
 return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>5OH!5 Stats HQ</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style id="css">'+document.getElementById('css').textContent+'</style></head><body><script id="js">'+j+'</scr'+'ipt></body></html>'}
async function pub(){try{if(!A)throw{code:'unavailable'};await A.publish(mk());return true}catch(e){msg=e.code=='conflict'?'Someone just updated the app - reloading':'Could not save ('+(e.code||'error')+')';draw();return false}}
async function save(){if(!pick.size){msg='Tick at least one player';return draw()}const id=edit?edit.id:'g'+Date.now(),sel=+(sSel??seasons().slice(-1)[0].n);
 const o={id,date:$('#dt').value,season:sel,pj:JSON.stringify([...pick.entries()])};extra=extra.filter(e=>e.id!=id).concat(o);persist();
 if(!await pub())return;
 pick=new Map();edit=null;msg=msg||'✅ Game saved!';draw();msg=''}
function ed(id){const e=extra.find(x=>x.id==id);edit=e;sSel=e.season;pick=new Map(JSON.parse(e.pj));draw();scrollTo(0,0)}
async function del(id){if(!confirm('Delete this game?'))return;extra=extra.filter(e=>e.id!=id);await pub();draw()}
async function csv(){let c='season,date,player,goals\n';seasons().forEach(s=>s.g.forEach(g=>g.p.forEach(p=>c+=`${s.n},${g.d},"${p[0]}",${p[1]}\n`)));
 try{const d=await claude.use('downloads');if(d){await d.save({filename:'5oh5-all-games.csv',data:c});return}}catch(e){}const t=$('#ex');t.style.display='block';t.value=c;t.select()}
draw();
