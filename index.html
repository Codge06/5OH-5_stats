main{max-width:900px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button.b{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
button.b{background:var(--ac);color:#000;border:0;font-weight:600;cursor:pointer}button.g{background:none !important;color:var(--tx) !important;border:1px solid var(--ln)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;cursor:pointer;user-select:none}
.pl.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}.pl input{width:18px;height:18px;accent-color:var(--ac)}
.pl .n{flex:1}.st{display:none;align-items:center;gap:4px}.pl.on .st{display:flex}.st button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}.st b{min-width:18px;text-align:center}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap}
.wrap{overflow-x:auto}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--tx)}.kpi span{font-size:12px;color:var(--mut)}
.bar{display:grid;grid-template-columns:100px 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:13px}.bar i{display:block;height:16px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--ac2))}.bar b{text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.mut{color:var(--mut);font-size:13px}.tag{display:inline-block;background:var(--ac);color:#000;border-radius:6px;padding:1px 7px;font-size:12px;margin-left:4px}
.g1{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}svg text{fill:var(--mut);font-size:10px}

[47,2]]],["2026-07-28",[[9,0],[10,1],[12,0],[13,0],[26,0],[29,1],[40,0],[47,3],[62,0]]],["2026-08-04",[[0,1],[9,0],[10,0],[29,1],[44,0],[47,1],[62,0]]]]},{"n":11,"g":[["2026-08-11",[[0,0],[9,0],[12,0],[13,2],[29,2],[44,0],[40,1],[47,0]]],["2026-08-18",[[0,0],[9,0],[12,0],[13,0],[26,0],[29,2],[40,3],[53,2]]],["2026-08-25",[[0,1],[9,0],[12,0],[26,0],[29,1],[39,0],[40,0],[47,1]]],["2026-09-01",[[0,0],[9,0],[10,0],[12,0],[13,0],[26,0],[2,1],[40,2]]],["2026-09-08",[[0,0],[10,1],[12,0],[13,1],[26,0],[29,2],[40,0],[53,0]]],["2026-09-15",[[0,0],[9,0],[10,1],[12,0],[13,1],[20,0],[29,1],[47,0]]],["2026-09-22",[[9,1],[10,0],[13,2],[26,0],[2,0],[29,3],[47,1],[53,0]]],["2026-09-29",[[9,1],[10,0],[5,0],[13,0],[29,0],[32,2],[40,0],[47,1]]],["2026-10-06",[[0,0],[12,1],[13,1],[26,0],[29,1],[39,1],[40,1],[47,0]]],["2026-10-13",[[0,0],[1,0],[9,0],[5,0],[12,0],[13,1],[20,0],[40,0],[63,0]]],["2026-10-27",[[0,0],[1,0],[9,0],[5,1],[12,0],[13,2],[29,2],[47,1]]]]}]};const NM=H.n;
const FX=[{"s":6,"d":"2024-12-03","us":8,"them":3,"opp":"TFC","by":"Ian Donald","at":"2024-12-04","t":"TFC : 8-3 win\nTeam: Ian, Yoz, Trud, Nuge, Dmac, Pierre, Jack, Ted\nGoals 6 Ted, 1 jack, 1 dmac \nFunnies - Pierre’s yellow card. Ted getting chat after scoring 6, half time talk around not kicking it above head high and then going 2-0 down in the half without stringing 1 pass together, Nuge tipping a long shot from inside their half on to the post with his hip\nMOTM - Tom Rudkin - doesn’t miss a 50:50 and takes his glasses off to head the ball","id":"f0"},{"s":6,"d":"2024-12-10","us":4,"them":3,"opp":"SMG","by":"Ian Donald","at":"2024-12-10","t":"*10th December - SMG: 4-3 W*\nTeam: Ian, Yoz, Nuge, Burge, Jack, Ted, Scouse Will, Ollie East,\nOn the day of our biggest game of the season, playing against an in form 9 from 9 SMG, our regular squad deserted us causing havoc for the newly appointed Gaffer. Fear not, our beloved ringers to the fore. Ted a nuisance up top all game, Scouse Will ran the show from CM whilst Ollie East’s one and two touch football  brought a needed calmness down the wings. Despite getting off to a flier and going 2-0 up after 5, and feeling in control of the game, we went in at half time 3-2 down. But the lads dug deep a clutch second half performance saw us secure a well deserved 4-3 win.\nFunnies: 0. The complete performance.\nGoals: 2 Jack, 1 Ollie 1 Will\nMOTM - Yoz stepped into CB like he’d played there all his life. Whilst the fans were worried how the mighty 5OH5 might fare without club legend hodges at LCB, fear no more. \n\nAnd that concludes a highly successful 2024 for the 50h5, it looks like we have an 8-0 next win next week so we will return on the 7th Jan refreshed and raring to launch our title challenge. As you were, ID.","id":"f1"},{"s":6,"d":"2025-01-14","us":4,"them":2,"opp":"Robben referee’s","by":"Ian Donald","at":"2025-01-14","t":"Robben referee’s 4-2 W\nGarden, Mooresy, Burge, Jack,\nVintage 5OH5. Given the recent resurgence from the lads, a petrified Darby dropped two players in the hope of causing an upset. What ensued was a niggly affair with chances missed for both sides, 5OH5 were off the pace. 1-1 at half time was probably fair, and we conceded early in the second half, but in true 5OH5 fashion, we dug deep and ground out a 4-2 win. However the drama was still to come. After a couple of celebratory beers at the roebuck, we see a man being chased by a police officer, toss a phone in the hedge before being threatened with a taser by said officer, and giving up. Mooresy, qualified lawyer, being the great citizen he is, kindly gave a statement to ensure justice will be had. \nWe go marching on, next week we take on HMP Brixton who took all 3 points last time out - big performance required. As you were, ID.","id":"f2"},{"s":6,"d":"2025-01-21","us":4,"them":6,"opp":"HMP Brixton","by":"Ian Donald","at":"2025-01-21","t":"21st Jan 6-4 loss to HMP Brixton\nThey say all good things must come to an end. A tough night for the 5OH5 as any glimmer of hope of cementing ourselves in the Ark Globe Academy Hall of Fame with a 3rd title slipped away. Despite getting off to a bright start, a couple sloppy errors meant we went in at half time 3-2 down, the second half commenced and Brixton sat incredibly deep and proved tough to break down, given the run of play, a 6-4 loss felt unjust, but that’s soccer ball at the end of the day. But not all is lost, next week we have the opportunity to determine who wins the league between SMG and Darby as we take on the men in red at 6.30, one might argue that makes us the king-makers. \nGoals shared about - Garden Myself Jack(?) and Yoz \n\nAs you were, ID.","id":"f3"},{"s":6,"d":"2025-01-28","us":4,"them":3,"opp":"Darby","by":"Ian Donald","at":"2025-01-28","t":"January 28th 4-3 win vs Darby.\nJustice has prevailed. The wankers in red shall not be winning the title this year. A real feisty encounter whereby Darby had no inclination on either trying to play football nor win the ball, ended with a last gasp volley from Jardin curling into the top corner to give 5oh!5 the 3 points they deserved. We played some nice stuff in and around getting fouled on the half way line whilst they scored 3 deflected goals from just launching throw ins into the box.\nGoals from Garden x2, Burge volley from edge of the box from corner, Ollie East slotted finish. \nSee you next Tuesday Gakpo.","id":"f4"},{"s":6,"d":"2025-02-04","us":3,"them":5,"opp":"billionaire bottle jobs","by":"Ian Donald","at":"2025-02-04","t":"Feb 4th - Always tough to get up for the graveyard shift 1 5-3 loss to billionaire bottle jobs.\nFrustrating game once again for 5OH5. It felt like another one where we played al the football, conceded some sloppy goals and just couldn’t take our chances when chasing the game. Unprecedented circumstances to begin with, with two head injuries in the first 5 mins, big shout to Pierre for playing the full 40 whilst gurning from a right hook from their keeper. Wishing Nuge a speedy recovery after another ball to the face after a good save from a one-on-one. Goals from Garden, Mooresy and Yoz. \nPersonal highlight of the match was Mooresy telling their overweight player to “shut the fuck up you fat fucking prick”\nTitle hopes well and truly over, roll on the jouè for the final two weeks of the season.","id":"f5"},{"s":6,"d":"2025-02-11","us":6,"them":2,"opp":"Clapham clipcloppers","by":"Ian Donald","at":"2025-02-11","t":"11th February - 6-2 W against Clapham clipcloppers. \nThe 6.30 kick off always brings with it logistical complexities. After a number ringer call ups with no success, we agree to go with 7, but with less than an hour before play I had received messages from both Pierre and Jardin that they were both going to be late. Jack jack decided to add insult to injury by turning up at 6.31 so we technically started the game with four 5oh!5 players on the pitch. Fortunately the one good bloke for Darby came to our rescue and played the first 17 minutes to help keep the oppo at bay, thanks Robbie. Comfortable win despite the early adversity which included Nuge panicking after a shot hit the roof the net, parrying it into our own goal to leave us 2-0 down after 10 mins. Never in doubt tho as the complete second half performance left no hope for CC to get anything from the game.\nGoals from Robbie the ringer, ID (goal of the season contender), jack jack 2, yoz 1, Jardin 1. Next week is the final game of the season before we welcome back the nibbliest man on the planet, and with it any hope of another title. As you were, ID.","id":"f6"},{"s":6,"d":"2025-02-18","us":4,"them":1,"opp":"Real Mech-Eng","by":"Ian Donald","at":"2025-02-18","t":"18th Feb -\nReal Mech-Eng 4-1 W\nA thoroughly enjoyable game of football where everyone committed to the joué, and we probably should have scored 15. Nuge kindly offered to do the first 10 in net, and despite playing some nice stuff we were 1-0 at the quarter mark after yoz rolled one to their striker on the edge of our box and Nuge decided he didn’t want to dive to stop it. Harding on debut decided to turn up 10 mins late, but slotted in like he’d been doing it all season at CB. The last half an hour felt like a complete onslaught, how Hugh Erritt isn’t celebrating his first 5OH!5 hat trick is beyond me. Maybe Nuge will take some sympathy on mooresy after being shouted at constantly for not running around enough up top. The chemistry of those two up top was electric so hopefully that’s not the last time we see them playing together. \nGoals from Nuge (although it’s currently being reviewed by the Goal Accreditation panel), ID (again?), Ted and Yoz. \nTeam: ID, Yoz, Jardin, Pierre, Hugh, Nuge, Ted, Harding \nThat wraps up the season, after losing 3 of our first 5 games, we fought back to finish 6 points off the top, not a bad effort and it felt like we left a couple out there. Pleasure as always gentleman. See you next week, ID.","id":"f7"},{"s":7,"d":"2025-02-25","us":7,"them":3,"opp":"robin’s referees","by":"Ian Donald","at":"2025-02-25","t":"25th Feb - robin’s referees 7-3 W\nTeam - ID, Jardin, Hugh, Pierre, Mooresy, Joe VR, Fred (Hugh’s mate), Gary Garding \nThe start of a new season brought new availability problems, particularly when “I’m so so so in” means I’ll cry off on the morning of the game. Whilst battling countless no’s we managed to get 8 which included Harry Harding taking an hour out of his drinking duties in London Bridge to lime bike to the ark globe academy, win a MOTM, and then lime bike back to the pub. Whilst a 7-3 win against a lower table side may sound comfortable, after 3 minutes we hadn’t strung 3 passes together, were 2-0 down, and it felt like it was going to be a long night. Fear not, despite missing some key figures the resolve of the 5OH!5 which has fated us so well over the countless seasons at the Ark Globe Academy came to the fore. Harry Harding straight off the bench bags a quick fire brace from CB to level it at 2-2 and from then on it was all plain sailing. Great work ethic, great commitment, great football all round. \nGoals from Harding x2 Jardin x3 Fred x2\nIt is so on. As you were, ID.","id":"f8"},{"s":7,"d":"2025-03-04","us":1,"them":2,"opp":"donkeys Fc","by":"Ian Donald","at":"2025-03-04","t":"4th March - 2-1 L to donkeys Fc \nWe have officially lost the referee. Utterly bizarre decision making throughout. 4 tough games coming up so better show some fight.\nTeam ID, Nuge, Harding, Hugh, Garden, yoz, Jack, Gibb \nGoal from Garden","id":"f9"},{"s":7,"d":"2025-03-11","us":4,"them":4,"opp":"HMP Brixton","by":"European Hughnion","at":"2025-03-11","t":"5OH!5 4-4 HMP Brixton. \n\nLineup: Gibb, Yoz, Scouse Will, Pierre, Harding, Hugh, Jack Jack, Yoz’s mate James.\n\nGoals: Yoz 1, Scouse Will 2, Hugh 1\n\nBoys come back from 4-2 down to equalise with 1 minute left. Another highly dubious decision from ref ref cost us a penalty in the first 10, but the boys stayed together and earned the point.","id":"f10"},{"s":7,"d":"2025-03-18","us":2,"them":3,"opp":"SMG","by":"Ian Donald","at":"2025-03-18","t":"18th March: 3-2 L to SMG\nA nailbiter that didn’t quite fall our way. As is typical when we play SMG we secured c. 20% of possession, and were kept in the game by a fantastic goalkeeping display by Hugh Erritt, but we missed some chances, and 3-3 would have felt fair. A couple of funnies across the game included one of their players self sinbinning after he kicked out at Burge off the ball, and Gibb trying to score a diving header from 20 yards after a diag had put it on a plate for Pierre. We roll on to next week where numbers are looking bare once again. 9.10 against billionaire bottlejobs.\nGoals - 2x Yoz\nTeam - ID, Burge, Yoz, Hugh, Pierre, nibble, and Scouse Will","id":"f11"},{"s":7,"d":"2025-03-25","us":5,"them":3,"opp":"Billionaire Bottlejobs","by":"Ian Donald","at":"2025-03-25","t":"25th March 5-3 W vs Billionaire Bottlejobs\nAvailability troubles continued, and it looked bleak at 6am this morning when we only had 6, but Joe VR and Gibb’s mate K to the rescue. Could not fault the performance from everyone, if it wasn’t for their keeper playing like 2015 David De Gea we’d have won by 8. Ref still hates us but we played some delightful football throughout. Gibb is silencing the critics not only with his performances but his ability to spot talent and bring them along in the form of a ringer. \nGoals: 3x Gibb’s mate K, 1 Mooresy, 1 Jardin\nTeam: ID, Yoz, Jardin, Nuge, Mooresy, Gibb, Joe VR, Gibb’s mate K","id":"f12"},{"s":7,"d":"2025-04-01","us":2,"them":8,"opp":"Darby","by":"Ian Donald","at":"2025-04-01","t":"1st March 8-2 L to Darby.\nBanter era of 5oh!5 officially back. Turns out Yoz isn’t the reason the ref can’t give a decision our way, so I apologise for ever getting annoyed at you Ewan. One of those incredibly odd games where it felt like every decision & bounce of the ball to them, but as Garden pointed out, maybe they’re just running about more than we are. That’s the run of tough games done and dusted so let’s get back to winning ways next week. \nGoals - Garden charge down, Burge Pen\nTeam - ID, Nuge, Pierre, Burge, Jardin, JJ, Hugh, Nibble.\nQuote of the day from the ref “who is that guy you’ve signed? You’re playing with 6”","id":"f13"},{"s":7,"d":"2025-04-08","us":8,"them":3,"opp":"GFC FC","by":"Ian Donald","at":"2025-04-08","t":"8-3 W vs GFC FC\nTeam: ID, Nuge, Pierre, Burge, Scouse Will, JJ, Baz Cooke, Nibbleman\nBack to winning ways with an assured performance, putting the newbies to the sword. Dominated possession in a game which saw Nuge make more touches than ever as we looked to beat the press and we successfully got Gibbo on the scoresheet to move him 1 clear of Pierre for lowest goal tally for the season. Well done gents \nGoals 2x OGs 2x Scouse Will 1x JJ 1x Nibble 1x Burge free kick 1x ID","og":2,"id":"f14"},{"s":7,"d":"2025-04-15","us":7,"them":3,"opp":"formerly in shape all stars","by":"Ian Donald","at":"2025-04-15","t":"15th April 7-3 W vs formerly in shape all stars \nTeam: ID, Burge, Pierre, Nibble, Cooke, Scouse Will, Skill Will, Kay\nDominant performance whereby the score line doesn’t do it justice. 3 goalkeeping errors led to our 3 goals conceded, well done Gibb and Burge. Actually played some real nice footy, things are brightening up. Some lovely finishes from Burge looking like he’s back to his best in front of goal, James Gibb puts himself 3 clear of Pierre in the fight for lowest goal scorer of the season, Harry Cooke looking electric down the left and Scouse Will running the show from CM. Very good very nice. \nGoals: Burge x2, Scouse Will x2, Gibb x2, Skill x1","id":"f15"},{"s":7,"d":"2025-04-22","us":11,"them":1,"opp":null,"by":"Ian Donald","at":"2025-04-23","t":"","kind":"score","odesc":"Score only (“11-1” in the chat); no match report","id":"f16"},{"s":7,"d":"2025-05-06","us":16,"them":6,"opp":"formerly in shape all stars","by":"Ian Donald","at":"2025-05-07","t":"6th May - 16-6 W vs formerly in shape all stars \nTeam: Gibb (C) Pierre, jack, DMac, Cooke, Scouse Will, Nuge, joe VR, Harding\nGoals: Cooke x1, Gibb x3, Scouse will x3, jack x3, joe VR x1, DMac x1, OG x1.","og":1,"note":"The report's scorer list adds up to 13, not 16 (the stats' Pierre ×3 isn't in it); with the report's 1 own goal the stats add up to 16.","id":"f17"},{"s":7,"d":"2025-05-20","us":3,"them":2,"opp":"SMG","by":"Ian Donald","at":"2025-05-20","t":"20th May 3-2 W vs SMG\nIt’s the biggy, it’s the one the players look forward to every season, SMG at home. The morning didn’t get off to a great start as club captain T Burgess cries off unwell, still TBC on whether it was pre match nerves or food poisoning, but up steps Danny Garden Jardin to save the day and ensure we don’t go with a bare 7. A fascinating first 20 saw us go in at half time at 0-0 despite creating a number of good chances and Nuge not having made a save. As legs tired in the second half more chances opened up, and a dubious “did it or didn’t it” cross the line as their striker hit the bar and the ref gives it to leave us 1-0 down with 15 to play. After some intricate play down the right, yoz stepped up with a composed left footed finish to level the score. After copping a load of stick all week for not scoring since his return, Baz Cooke showed his quality with a rocket of a first time finish to send us 2-1 up before a deft finish at the back post put us 3-1 up with 6 to play. In true 5OH5 fashion we proceeded to sit back and invite pressure, which led to Nuge making numerous saves to keep us ahead, with them scoring a second goal with basically the last kick of the game. Big shout out to Will who was absolutely magic in CM tonight, RIP Goodison Park.\nIt’s good to be back. As you were, ID. \nTeam: ID, Nuge, Yoz, Scouse Will, Baz Cooke, Jardin, Pierre, Nibble\nGoals: Yoz, Baz Cooke x2","id":"f18"},{"s":7,"d":"2025-05-27","us":5,"them":1,"opp":"billionaire bottlejobs","by":"Ian Donald","at":"2025-05-27","t":"27th May 5-1 W vs billionaire bottlejobs \nHelluva team performance capped off by a coupla screamers. After a slightly nervy 10 mins where we went 1-0 down despite playing some alright footy, we relaxed into the game and then controlled it to come out comfortable winners. Nice build up play throughout the team to grab Martin a debut goal, then some delightful one touch passing to find Yoz marauding forward late on and side foot it into the bottom corner for our second. The first of the screamers was  a 40 yard diag from Yoz at RB picking out Jack who’d peeled off and somehow gets up  like prime Fellaini and guides the ball back across goal into far corner. Two mins later Yoz scores an absolute rocket with his left into the toppest of bins to put us 4-1 up and out of sight. A calm finish from Ewan with a couple minutes to play completed his hat trick and a resounding victory. Huge shift from everyone, well played. As you were, ID.\nTeam: ID, Nuge, Yoz, Scouse Will, Cooke, JJ, Gibb, Martin\nGoals: Mart, JJ, Yoz x3","id":"f19"},{"s":7,"d":"2025-06-03","us":2,"them":2,"opp":"Darby","by":"Ian Donald","at":"2025-06-03","t":"Big shift gents.\n3rd June 2-2 vs Darby\nGreat game, could have gone either way, big shift from everyone. 2-0 down and feeling under the cosh at half time, it was a helluva 2nd half performance where we could have nicked it. Dubious referreeing decisions throughout. The tough games are now done so roll on Nuge up front, Gibb in goal and a bit of fun for the last 3 weeks. \nTeam: ID, Nuge, DMac, Yoz, Will, JJ, Gibb, Ted\nGoals: Yoz x1 banger, Ted","id":"f20"},{"s":7,"d":"2025-06-10","us":3,"them":2,"opp":"GFC","by":"James Gibb","at":"2025-06-10","t":"3-0 up, followed by an OG ‘funny 5’ to finish 3-2. Overall 4 xG left out there. Goals were pearlers though. A true poachers finish from Jacky boy, a zinger from Mouse Scran and a great team goal rounded off by Cookey for the third. Making a case for 3rd 👊🏽","odesc":"Opponent not named in the report; confirmed as GFC","id":"f21"},{"s":7,"d":"2025-06-24","us":9,"them":4,"opp":"real mech eng","by":"Ian Donald","at":"2025-06-24","t":"24th June 9-4 W vs real mech eng\nLovely way to sign off the season, another confident performance secured us with 3rd place in the league which is a decent effort given the start we had last year. A couple of highlights from the game - Captain Fantastic returns to provide additional fragility to the back and Gibbo signs off his most prolific season ever with a hatty which included a first time right footed strike and a pen. Great to have Kay back and amongst the goals. Big yards from Cookey Will and Dmac as ever and hopefully Yoz was saving his goal scoring threat for the new season. As is the way at the Ark Globe Academy we roll straight into a new season with a tough start - SMG at 19.10. Hopefully the lads at Glastonbury have one eye on this big fixture and those not in attendance will be having a quiet weekend in preparation. As you were, ID.\nTeam, ID, Craigo, Cooke, Yoz, Will, D-Money,  Nibble, Kay\nGoals, Gibb x3, Kay x2, Cooke x1 Yoz x 1 Scouse Will x2","id":"f22"},{"s":8,"d":"2025-07-01","us":6,"them":2,"opp":"SMG","by":"Craig Hodges","at":"2025-07-01","t":"5OH!5 6-2 SMG\nHodges, Pierre, Gibb, Cooke, Yozz, Mooresy, Kay, Ollie, Millsy\nGoals: Millsy X2, Kay x2, Pierre X1, Ollie X1\n\nReal statement win to start the season with a seriously dominant performance. 1-0 down early the fellas turned it on with a Kay goal, quickly followed by a Millsy goal & industrious run from Pierre that somehow ended up with the ball at his feet to roll into the corner. Millsy saw us go 4-1 up just before the break and Kay made it 5 after a wrongly timed keepers call saw the ball trickle across the goaline for a tap in. After trying to induce a funny 5, Ollie scored his customary goal vs SMG after some more calamitous defending and the win was secured.\n\nA word for 2 early save of the season contenders, Hodges trying to catch a stinging volley stomach high which somehow ended up being tipped over the bar off a rogue elbow and Gibb miraculously tipping a shot wide that hit the post and richocheted back off him. \n\nHell of a start","id":"f23"},{"s":8,"d":"2025-07-08","us":3,"them":1,"opp":"HMP Brixton","by":"Ian Donald","at":"2025-07-08","t":"8th July 3-1 W vs HMP Brixton\nThe bogey team, the game none of us look forward to when the fixture list comes out, but not today. On a blistering evening in Borough, the boys came to play. More running from Gibb than we have ever seen, the new inverted CB role, and a great pleasure to have our private equity backer back on the team sheet and amongst the goals. The complete domination wasn’t quite reflected in the scoreline, but a lot of fun was had. 2 from 2 and we go marching on. \nAs you were, ID.\nTeam ID, Craigo, Nuge, Pierre, Will, Burge, JJ, Hugh, Nibble\nGoals Scouse Will x2, Burge x1","id":"f24"},{"s":8,"d":"2025-07-22","us":7,"them":0,"opp":"ROSMAS FC","by":"Ian Donald","at":"2025-07-23","t":"22nd July 7-0 W vs the newbies ROSMAS FC.\nMany a team has turned up to the ark globe academy thinking that talent beats hard work, and they’re consistently proven wrong. Despite their front 3 all having clearly played a decent standard of football, 5OH5 absolutely tore the naive ROSMAS side apart, teaching them a lesson they won’t forget for a while. Great to see Jack jack back in the hat trick club, and Hugh Erritt finding the roof of the net with a rocket from his favoured RW position. Pierre looks back to his best which is great to see, Nuge showed great commitment to maintain the clean sheet with a couple of big saves near the end. The title charge is on.\nTeam: Nuge, ID, CH, Will, Burge, JJ, Pierre and Hugh\nGoals: Jack x3, Will x2, Burge, Hugh","id":"f25"},{"s":8,"d":"2025-07-29","us":6,"them":4,"opp":"GFC","by":"Craig Hodges","at":"2025-07-29","t":"29th July \n5OH!5 6-4 GFC\nAn important win for the boys when it looked for a time as if it was going to be dropped points. 5OH!5 started fast, popping the ball around and racing into a 2-0 lead, with Pierre hitting it straight at the keeper from 2 yards to score. A funny 15 then followed with some nice stuff intertwined with some not so nice, leading to a 3-2 deficit at the half. After some stern words at half time, along the lines of stop being miserable bastards, a rejuvenated team came out and showed why we are top of the league. A big shout out to Harry Cooke, on his last game for 5OH!5 before a 2 year loan stateside, bagging a handy double including one off the chest from a lovely Donald diag. He will be missed.\n\nLate news in that Darby have lost to 8th place CR7FC giving us an early 3 point lead in the league. LFG. \n\nTeam: Nuge, ID, CH, Yozz, Will, Pierre, Burg, Cooke\nGoals: Pierre X2, Cooke X2, Yozz X1, Will X1","id":"f26"},{"s":8,"d":"2025-08-05","us":7,"them":2,"opp":null,"by":"Ian Donald","at":"2025-08-05","t":"5th August 7-2 W vs newbies that beat Darby.\nThe lads go marching on with a demolishing of the team that beat Darby last week. Scouse Will great hatty in the first half. Hugh Ferritt back to his best with a brace. Gibbo only 6 one on ones missed. \nTeam: ID, CH, Nuge, Burge, Will, Hugh, Pierre, Gibb\nGoals: Will x3 Hugh x2, Burge x1, Pierre x1","odesc":"Report says “newbies that beat Darby”","id":"f27"},{"s":8,"d":"2025-08-12","us":0,"them":2,"opp":"Darby","by":"Ian Donald","at":"2025-08-12","t":"12th August 2-0 L to Darby.\nTough game to go with 7 after 3 drop outs on the day and the pick up 3 very handy ringers to bolster their side. Can’t fault the effort by everyone, just didn’t have enough on the day.\nTeam ID, CH, Pierre, Will, DMac, Gibb, Marshall","id":"f28"},{"s":8,"d":"2025-08-19","us":2,"them":3,"opp":"Robbens Referees","by":"Craig Hodges","at":"2025-08-19","t":"19th August 3-2 L to Robbens Referees.\nThe slide is firmly on after another defeat. Plenty of chances but a strong keeper ringer & some clinical finishing put us to the sword. A bye next week arguably coming at the best time with a turnaround drastically needed\n\nTeam ID, CH, Pierre, Will, Nuge, Gibb, Jack, Marshall\nGoals: Will, Jack","id":"f29"},{"s":8,"d":"2025-08-26","us":8,"them":0,"opp":null,"by":"Ian Donald","at":"2025-08-23","t":"","kind":"wo","note":"26 Aug 2025 – opponents did not show; an 8–0 walkover was awarded, so no game was played.","id":"f30"},{"s":8,"d":"2025-09-02","us":3,"them":3,"opp":"SMG","by":"Ian Donald","at":"2025-09-03","t":"2nd September 3-3 SMG\nGames against SMG rarely disappoint the fans and this was another one of those games. The boys started quick and dominated the first half going in at 2-0 from goals from Gibb and Yoz with Nuge having very little to do. In true 5OH5 fashion we forgot how to play football, not helped by jacks injury, and with 1 minute to go we conceded our third to leave us 3-2 down. ID & CH switch the back to the front for one last push and captain leader legend Hodges steps up with a beautiful left footed strike that rattles in off the post to salvage a point. We’ve stopped the rut, well done lads. Next week we take on our bogey team HMP @7.10. Let’s get back to winning ways \nTeam: ID, CH, Nuge, Yoz, Dmac, JJ, Gibb, Pierre\nGoals: Gibb Yoz & CH","id":"f31"},{"s":8,"d":"2025-09-09","us":7,"them":3,"opp":"HMP Brixton","by":"Craig Hodges","at":"2025-09-09","t":"9th September 7-3 HMP Brixton\nThe rot has been stopped with a resounding victory over past bogey team HMP Brixton. \nKay left the boys sweating again, turning up 5 minutes into a game where we had 5% pass completion rate despite Will pleading with ID & CH to keep the ball. 1-0 down quickly turned into 2-1 and then 3-2 from their only 3 shots, threatening to derail an otherwise solid performance before Kay & Will got us to 4-3. The joue then ensued, even Ian got in on the act, leading to a comfortable 7-3 victory. \nTeam: ID, CH, Yoz, Gibb, Will, Pierre, Kay\nGoals: Gibb, CH X2, Kay X2, ID, Will","id":"f32"},{"s":8,"d":"2025-09-16","us":5,"them":1,"opp":"Madeline Milan FC","by":"Ian Donald","at":"2025-09-16","t":"16th September 5-1 W vs Madeline Milan FC\nTough first half against the high pressing newbies meant a very even first half which left the score at 1-1 at the break. But some composed words of wisdom at half time settled any nerves and it was the complete second half performance with Nuge only touching the ball to spray it to his full backs. Thoroughly enjoyable, well played gents. Next week we take on the bloke who’s little toe is better than all of us despite us battering them 7-0, hope we are all available.\nTeam: ID, CH, Nuge, Yoz, Will, Pierre, DMac, Gibb\nGoals: Will x3, Pierre, DMac","id":"f33"},{"s":8,"d":"2025-09-23","us":9,"them":1,"opp":"Rosmas FC","by":"Craig Hodges","at":"2025-09-23","t":"23rd September 9-1 Rosmas FC\nThe man with a clearly very talented little toe comes unstuck again by some liquid 5oh!5 joué. Excellent footy from the boys from the start with 2 great ringer performances bring a thumping win. Availability desperately needed for next week so make yourself free if you can\nTeam: ID, CH, Yoz, Hugh, Dmac, Will, Millsy, Calvin\nGoals: Millsy x2, Dmac x2, will x2, Calvin x1, CH x1, OG X1","og":1,"id":"f34"},{"s":8,"d":"2025-10-07","us":4,"them":1,"opp":"CR7FC","by":"Craig Hodges","at":"2025-10-07","t":"5oh!5 4-1 CR7FC\n5OH!5 again proving we are only as good as our ringers with a solid performance to beat CR7FC. We started very strongly with all of the ball but true to form, we don't score when they have less than 7 people. Kay opened the scoring, but having threatened to open the floodgates we went in 1-0 at half time. Kay got another after half time but a funny 5 ensued when they worked out if they press us we forget how to play. Nuge made some huge saves but they did pull one back. Will scored the all important 3rd before Kay put the game beyond doubt with his hat trick. Darby next week, let's get after it.\n\nTeam: Nuge, CH, Hugh, Pierre, Will, Dmac, Gibb, Kay\nGoals: Kay X3, Will X1","id":"f35"},{"s":8,"d":"2025-10-14","us":3,"them":4,"opp":null,"by":"Ian Donald","at":"2025-10-14","t":"Lost 4-3 unfortunately. Great shift from the lads. At kick off we had 6 and they had 9 and we slipped to 2-0 down pretty early. Great fight back including a gibbo header and two worldies from Ted put us 3-2 up with 10 to go, but a couple of Darby-esque smash it across goal and get a little touch on it left us 4-3 down and the season done and dusted. \nTeam ID, CH, Nuge, Hugh, Pierre, Gibb, Kay, Ted\nGoals, Gibb, Ted x2","odesc":"Not named in the report","id":"f36"},{"s":8,"d":"2025-10-21","us":6,"them":4,"opp":"Robbens Referees","by":"Craig Hodges","at":"2025-10-21","t":"5oh!5 6-4 Robbens Referees\n\nTear up the stats sheets, we have a new equal 4th top scorer of the season! \n\nThe reversing of positions threatened to lead to farce when Pierre watched a pea roller trickle into the corner after 2 mins, but Tom Nugent had other ideas. With his audition to be new permanent striker a mere 5 minutes old, he had 2 touches, 2 goals including a header and Bergkamp-esque audacious flick. We went from strength to strength, always finding a free man and running rings round the hapless opposition. Nuge got another 2, Ted with a great goal and even Gibb scored with a tidy finish into the far corner. \n\nAt half time we worked out that we always had a free man because we were actually playing against 6. Our fortunes changed somewhat when the Darby keeper turned up and played for them in goal in the second half. Gibb went in for the last quarter and immediately conceded 2 but we then rode the storm out. Luckily we still had time for Pierre to give an oppo player concussion and Gibb to concede another before we were saved with the full time whistle at 6-4. \nHonourable mentions for a sweet sweet Trud nutmeg & Kay getting the biggest nibble I've ever seen from the ref. \n\nTeam: Nuge, CH, ID, Pierre, Ted, Gibb, Kay, Trud\nGoals: Nugent X4, Ted X1, Gibb X1","id":"f37"},{"s":8,"d":"2025-10-28","us":4,"them":2,"opp":"Smoko Atheltico","by":"Ian Donald","at":"2025-10-28","t":"28th October 4-2 W vs Smoko Atheltico\nA make shift side with only Donald Hodges and Nibble from the whatsapp group available to play. We start with 6 players and they start with 5 set the tone for the level of football that ensued. Highlight - ID scoring from the edge of his own box whilst GK. Gibb with 8xG but no goals to show for it.\nGoals: ID, Ollie x2 Kay x1\nTeam: ID, CH, Gibb, Trud, Kay, Ollie, Mohit","id":"f38"},{"s":9,"d":"2025-11-04","us":4,"them":1,"opp":"Smoko Atletico","by":"Craig Hodges","at":"2025-11-04","t":"5oh!5 4-1 Smoko Atletico\n\n1 game, 1 win.\nA bare 7 vs 10 was going to be difficult but a well navigated game leads to a 4-1 win. Game was turgid to start, Will back with a bang opening the scoring with a vintage finish rifled across his body. The kiwis equalised and threatened to make life very difficult for us, despite the 2-1 score line at half time. We came out from the half and scored immediately to calm the nerves, Gibb putting enough pressure on the oppo for a comedy own goal, a shot bouncing off 3 men and the roof. CH9 made it 4-1 before we saw out the game in professional fashion, ringer Cameron an excellent addition at the back.\n\nTeam: CH, Nuge, Hugh, Pierre, Gibb, Will, Cameron\nGoals: CH X2, Will X1, OG X1","og":1,"id":"f39"},{"s":9,"d":"2025-11-11","us":3,"them":1,"opp":"Robbens Referees","by":"Craig Hodges","at":"2025-11-11","t":"5OH!5 3-1 Robbens Referees \n\nA triumphant return for Mooresy & Garden. A well ground out win, Mooresy getting on the scoresheet almost immediately but we failed to get the crucial 2nd, whilst having a few scares at the other end. Will got the goal to settle us but the inevitable conceded goal led to a slight funny 5, Nuge making some huge saves to keep us in front. We got back in control towards the end, missing about 10 golden chances before a mooresy ball into the corridor of uncertainty saw Pierre bundle home to secure 3 points. 2 from 2, ROSMAS FC (who?) next week. \n\nTeam: CH, Hugh, Pierre, Nuge, mooresy, Gibb, will, Garden\nGoals: Mooresy x1, will x1, Pierre x1","id":"f40"},{"s":9,"d":"2025-11-18","us":3,"them":1,"opp":"Rosmas FC","by":"Ian Donald","at":"2025-11-18","t":"18th November 3-1 W vs Rosmas FC\nVintage 5OH5 performance - not pretty but it bloody works. Not at our fluent best with so much of the squad missing, it’s hardly surprising and a hard working performance ended in a relatively comfortable win. Notable shout out to Nuge for a MOTM performed with some big saves, and his clean sheet only lost after I gifted them the goal when we were cruising at 3-0. Great also to see Gibbo strike a first time volley from left wing and claim it nearly went in before being reminded that it did in fact go out for a throw in. Big shift also from JJ on the sidelines cheering us on too🤝 Top of the league and we go marching on.\nTeam: ID, Nuge, Yoz, Jardin, Nibble, Ted, Joe VR, Cooper\nGoals: Cooper, Ted, Jardin","id":"f41"},{"s":9,"d":"2025-11-25","us":0,"them":4,"opp":"HMP Brixton","by":"Craig Hodges","at":"2025-11-25","t":"5OH!5 0-4 HMP Brixton\n\nA day to forget against our bogey team. A frenetic start which we never really recovered from, with individual errors leading to us being 3-0 down at half time. Second half was more even but the Darby keeper playing for them didn't help our cause with some big saves. \n\nThe papers will rightly focus on the ref & 5oh!5's discipline, with a record 2 sin bins in a game from Will \"I won't say anything to the ref again\" Thomas & Ted \"paying the club back for taking a chance on his discipline\" Hodges \n\nWe go again.\n\nTeam: CH, ID, Ted, Will, Gibb, Crane, Tooms, Ollie \nGoals:","id":"f42"},{"s":9,"d":"2025-12-02","us":1,"them":4,"opp":"Madeleine Milan","by":"Craig Hodges","at":"2025-12-02","t":"5oh!5 1-4 Madeleine Milan\n\nTough one to take against a good side. A relatively even first half saw us go into half time 2-1 down thanks to a Yozz volley that hit the roof then the bar to fall at Ted's feet. Second half we ran out of steam and they scored 2 late to seal it.  \n\nWhen we thought we couldn't lose the ref anymore, he told an unnamed 5oh!5 player on separate occasions that he'd fuck him up and to \"fuck off you dick\". A complaint to Howard Webb at PGMOL will be lodged.\n\nTeam: CH, Yozz, Nuge, Pierre, Ted, Crane, Robbo\nGoals: Ted","id":"f43"},{"s":9,"d":"2025-12-09","us":2,"them":1,"opp":"Darby","by":"Ian Donald","at":"2025-12-09","t":"9th December 2-1 W vs Darby.\nInject it. Mooresy back running the show up top. Nuge cool calm and collected at the back, options galore at the back and Pierre managing to make the perfect number of bad fouls without being booked. Whilst 2-1 completely flatters them, it did feel like vintage 5OH5 for the past 3 minutes holding on for the win. Great performance from everyone and a solid turn out at the ship for a couple of celebratory pints. 🤝\nBottom of the league next week - GD requiring a little assistance so let’s smack ‘em.\nTeam: ID, Nuge, Hodges, Yoz, Will, Pierre, Gibbo, Mooresy.\nGoals: Pierre & Yoz","id":"f44"},{"s":9,"d":"2025-12-16","us":5,"them":1,"opp":"cold street","by":"Craig Hodges","at":"2025-12-16","t":"5oh!5 5-1 cold street\n\nA true 5oh!5 classic. We arrive to the oppo warming up in the playground & score early through a Yozz penalty. We quickly realise they are the worst team to ever grace the ark globe academy & true to form, then attempt and fail to play joué for the next 38 minutes. 2-0 at half time flattered them, despite Joe VR hitting our own bar in an attempted clearance. We came out for the second half with Nuge up top, scoring 2 from 2 Gibb assists - a 1000/1 shot pre game. Yozz completed his hattrick after they scored a 20 yard half volley to round up a vintage 5oh!5 performance.\n\n3 points is good but seeing Nuge & Garden together again is priceless. Merry Christmas all, we go again in the new year. \n\nTeam; CH (100), Pierre, Nuge, Gibb, Yozz, Garden, Joe VR, Fred\nGoals: Yozz x3, Nuge x2","id":"f45"},{"s":9,"d":"2026-01-06","us":4,"them":0,"opp":"SMG","by":"Craig Hodges","at":"2026-01-06","t":"5oh!5 4-0 SMG\n\nStorm Goretti fails to blow over 5OH!5. A real statement win to start the year, dismantling long time enemies SMG with a seriously good second half performance. First half was one of the most boring ever played but we came out firing in the second. Millsy & Ted providing quality up top with a goal each, Smithy with an engine in the middle & the rest of us running around. Gibb provided the cherry on top with a finish into the roof of the net in the last 5 minutes.\n\nAn HMP Brixton loss puts us level on points at the top. LFG\n\nTeam; CH, ID, Pierre, Ted, Gibb, Garden, Smith, Millsy\nGoals: Millsy X1, Ted x1, Gibb x1, Smith x1","id":"f46"},{"s":9,"d":"2026-01-13","us":11,"them":2,"opp":"CR7 FC","by":"Ian Donald","at":"2026-01-13","t":"13th Jan: 11-2 W vs CR7 FC\nVery comfortable victory against a side that offered very little both offensively and defensively. One thing to note is Will has successfully dropped himself below Gibb in the penalty taker list after missing one late on. Top of the league at the half way stage, great work gents.\nTeam: ID, Hodges, Nuge, Yoz, Hugh, Will, Ted, Nibble\nGoals: Ted x5, 2x Yoz, 1 x Will, 1 x Craig, 1 x Hugh, 1 x Gibb","id":"f47"},{"s":9,"d":"2026-01-20","us":3,"them":5,"opp":"Smoko Athletico","by":"Craig Hodges","at":"2026-01-21","t":"Apologies for the delay\n\n5OH!5 3-5 Smoko Athletico\n\nNot very much to say after a disappointing evening, nothing really seemed to work & we didn't deserve to get anything out the game. One positive that Will has shaken the penalty curse, saving us from Gibb on pens.\n\nResults elsewhere mean it is still very much all to play for with Darby now top & 1 point separating 1st and 5th.\n\nTeam: CH, ID, Nuge, Garden, Yozz, Will, Gibb, Mooresy\nGoals: Will x2, Yozz x1","id":"f48"},{"s":9,"d":"2026-01-27","us":3,"them":1,"opp":"Robbens Referees","by":"Craig Hodges","at":"2026-01-27","t":"5OH!5 3-1 Robbens Referees\n\nStorm Chandra battered the south west but it was Robbens referees who took a battering in south London. Well ground out win despite going 1-0 down early with 6 men. A couple of huge saves from Nuge got us in 1-1 at HT and we then controlled the 2nd. Madeline milan loss & Derby vs HMP means we will at least be 3rd going into next week\n\nTeam: CH, Nuge, Hugh, Pierre, Garden, Will, Ted, Gibb\nGoals: CH x1, Gibb x1, Ted x1","id":"f49"},{"s":9,"d":"2026-02-03","us":8,"them":1,"opp":"Rosmas","by":"Ian Donald","at":"2026-02-03","t":"3rd Feb 8-1 win vs Rosmas \nGetting up the graveyard shift is always tough, but a hell of a performance put Rosmas to the sword. Some big saves from Nuge early on, but other than that we were in complete control. The only missing thing was a Nibble goal despite his 15 attempted shots. Personal highlight was when their captain requested the ref to “just call it” because it was so unenjoyable getting outplayed by us.\nGoals: Smithy x3 (inc 1 dubious OG) Jardin x2 (inc 1 dubious OG) Yoz x2 ID\nteam: ID, Nuge, Yoz, Jardin, Pierre, Smithy, Craneo and Gibb.","id":"f50"},{"s":9,"d":"2026-02-10","us":6,"them":5,"opp":"HMP Brixton","by":"Craig Hodges","at":"2026-02-10","t":"5OH!5 6-5 HMP Brixton \n\nHMP, bogey team no longer. A really good win on a wet night in Elephant & Castle, getting revenge for earlier in the season. The game ebbed and flowed, we gave away a few with some bad set piece defending but also scored some unreal goals, Ted & Millsy on absolute fire in particular. \n\nDarby beat SMG in the late kickoff so pressure is needed leading up to the crunch game on the 24th Feb. \n\nTeam: CH, ID (100 club 💯), Nuge, Will, Garden, Ted, Return of the Mac, Gibbo, Millsy\nGoals: CH x1, Will x2, Millsy x1, Ted x2","id":"f51"},{"s":9,"d":"2026-02-17","us":6,"them":0,"opp":"Madeline Milan","by":"Ian Donald","at":"2026-02-17","t":"6-0 W vs Madeline Milan\nAfter a frustrating defeat earlier in the season against a bunch of bad blokes, this felt like a statement win. Millsy demonstrating exactly why the back room staff worked so hard to sign him mid season with a fantastically taken hat-trick. But MOTM goes to James Nibble Gibson who fought off his influenza to put in a stellar performance including the best goal I’ve ever seen at the Ark. We also celebrate our third centurion at the Ark Globe Academy - congrats Pierre. Well worth the two hour round trip to bring up your hundred with a second half cameo including a left footed strike.\nNext week is the biggy as we take on Darby @ 9.10 to likely decide the title. Rest up this kids. 🫡\n\nTeam: ID, CH, Nuge, Yoz, Will, Pierre, Gibbo, Millsy\nGoals Millsy x3, Will, Pierre Gibbo (screamer)","id":"f52"},{"s":9,"d":"2026-02-24","us":1,"them":1,"opp":"Darby","by":"Craig Hodges","at":"2026-02-24","t":"5OH!5 1-1 Darby\n\nHonours even in the graveyard shift. The media hype surrounding the two teams potentially getting to the players, with both teams struggling to muster clearcut chances. The first goal came from a 1 in a 101 shot from the Derby left winger, the ball flying into the corner before Nuge could move. We worked hard to get back into the game & found a moment of magic when Ted found Will at the back post with a lovely chipped ball. The last 10 was fairly frantic until Yozz's masterplan nearly fed into place with the last kick of the game, Nuge's long ball finally finding Ted's feet who rolled his defender but the makeshift keeper stood tall and kept him out. \n\nIt's now in Darby's hands with 3 to go, 3 wins needed to keep em on their toes. \n\nTeam: CH, ID, Nuge, Will, Pierre, Ted, Millsy, Gibb \nGoals: Will x1","id":"f53"},{"s":9,"d":"2026-03-03","us":9,"them":1,"opp":"cold street","by":"Ian Donald","at":"2026-03-04","t":"03/03/26 - 9-1 vs cold street \nVery comfortable victory against bottom of the table as we shook things up a little giving Nuge and Craig stints up top. Turned into a bit of a farce by the end as certain individuals couldn’t resist the opportunities to try and boost their end of season stats.. full turn out at the pub afterwards to welcome in spring which was great to see.\nTeam: ID, CH, Nuge, Yoz, Pierre, Ted, Dmac, Gibb\nGoals: CHx2 Nuge x2 Dmac x2 Ted x1 Gibb x1 OG x1","og":1,"id":"f54"},{"s":9,"d":"2026-03-10","us":1,"them":2,"opp":"SMG","by":"Craig Hodges","at":"2026-03-10","t":"5oh!5 1-2 SMG\n\nA game more akin to the 5oh!5 SMG games of the past that we end up on the losing end of. Surprisingly chippy from the off, we probably got the best of the first 5 minutes but struggled to get shots on target. They scored a good goal from range, Garden no chance. Then a stroke of luck, after getting away with a few ugly swipes they tried to get one back on us, Kay drawing an off the ball foul & the ref then deciding to send the bloke off for 'talking back'. At 1-0 down but a man up we thought we would come roaring back into the game. However a direct free kick followed by us going down to 6 as well quickly put that to bed. We huffed and puffed, DMac clawing one back with 2 mins to go but couldn't get the equaliser. \n\n2nd again ole ole. \n\nTeam: CH, Garden, DMac, Ted, Will, Gibb, Kay, Crane\nGoals: DMac x1","id":"f55"},{"s":9,"d":"2026-03-17","us":3,"them":4,"opp":"CR7","by":"DMac","at":"2026-03-17","t":"5OH!5 3 - 4 CR7\n\nThe ghost of Karius returns. \nDespite being bolstered by some of the country’s finest economic minds, we grasped defeat from the jaws of victory. \nWith lots of new faces, we took a little while to get going, but anchored by Kay up top we got back level twice, at 1-1 and 2-2.\nMy old insurance mate Sam (who is, in fact, our age) got us ahead with a great finish off the right wing.\nBut the real story was in net for 5OH!5. Keen to make a good impression in front of his BoE mates, Gibbo let in 3 goals, all funny in different ways, including being sat down by a ball roll, and a shameless attempted side-netting con of our favourite ref.\nIt was 4-3 to them (and they weren’t great), but it was good fun.\nTeam: Dmac, Gibbo, Pierre, Kay, Sam, Jake, Danny, Waris\nGoals: Kay x2, Sam x1","id":"f56"},{"s":10,"d":"2026-03-24","us":7,"them":0,"opp":"Los Chumpos","by":"Craig Hodges","at":"2026-03-24","t":"5OH!5 7-0 Los Chumpos\n\nA laavly start to the season, playing a new team that don't know the rules. We started a little complacent and got a kick up the arse when they hit the bar in the first 3 mins but thoroughly controlled it after that. Gibb did everything in his power to stat pad and could only manage a questionable OG from a yard out. \n\nDarby didn't have an oppo in the game after so we played a Community Shield like friendly straight after our game. A thrilling encounter, us with only 7, led to a 5-4 loss. Annoyingly, it was actually a really well mannered & enjoyable game which has slightly broken the 4th wall of them being cunts. Nevertheless, the real fixture will be fascinating come what April. \n\nTeam: CH, ID, Nuge, Pierre, Yozz, Will, Gibb, Ted \nGoals: Ted x2, ID x1, Gibb x1, Will x2, Yozz x1","id":"f57"},{"s":10,"d":"2026-04-07","us":7,"them":5,"opp":"robbens referees","by":"Ian Donald","at":"2026-04-07","t":"07/04/26 - 7-5 W vs robbens referees \nVintage 5OH5, starting with the skipper forgetting to like his only message and then panicking that we didn’t have enough players. Scrappy first half where we snatched at a number of chances left us 3-2 down at half time was followed by a dominant first 10 of the second half putting us 6-3 up and cantering towards victory. Then we do what we do and give it away twice on the edge of our box to leave it 6-5 with 5 to go and it felt nervous, not helped by Yoz doing some of the worst time wasting the Globe has ever seen. A late breakaway goal then put the game to bed and we all came off smiling. Felt even sweeter after we watched Darby get beat 3-1 in the early kick off. 3-3 and top of the league is what we love to see.\nTeam: ID, Pierre, Yoz, Will, Dmac, Millsy, Jardin, Calvin\nGoals: Will x3, Yoz, Dmac, Millsy, Calvin","id":"f58"},{"s":10,"d":"2026-04-14","us":10,"them":1,"opp":"HMP","by":"Craig Hodges","at":"2026-04-14","t":"5oh!5 10-1 HMP\n\nOne of the best 5oh!5 performances in recent memory brings an absolute thumping win against our old bogey team. They started with 5 which, as per usual, we only scored 1 in 5 minutes. The absolute joué then began with a real free flowing performance & every outfield player getting on the scoresheet. Of course we couldn't make a whole game without making a mistake, a last minute bouncing cross being essentially caught by Hywel at the back post under 0 pressure leading to a pen for the last kick of the game. \n\n4/4 and we are cooking\n\nTeam: CH, ID, Nuge, Pierre, Will, Ted, Millsy, Hywel\nGoals: Ted x3, Will x2, Millsy x1, Pierre x1, CH x1, ID x1, Hywel x1","id":"f59"},{"s":10,"d":"2026-04-21","us":10,"them":3,"opp":"La Masia","by":"Craig Hodges","at":"2026-04-21","t":"5OH!5 10-3 La Masia \n\nWhat could have been a horrible cold graveyard shift with 6 turned into another outstanding performance from 5OH!5. Juvenated by the return of 2 5OH!5 originals from lengthy absences and an incredibly tanned looking Skill fresh off the beds we put La Masia to the sword. Another brilliant attacking showing, 5 from 5 and top scorers in the league for maybe the first time ever?\n\nNext week CR7 at 6:30 - everyone rest up.\n\nTeam: CH, ID, Pierre, Will, Millsy, Burg (C), Hugh, Skill  \nGoals (TBC): CH x1, Hugh x1, Burg x1, Skill x2, Millsy x3, Will x2","id":"f60"},{"s":10,"d":"2026-04-28","us":11,"them":1,"opp":"CR7 FC","by":"Ian Donald","at":"2026-04-28","t":"5OH!5 11-1 W vs CR7 FC\n6 from 6 we go marching on - the goals just won’t stop at the moment and this was another demolition. A couple important saves from Nuge early on settled the nerves but after that it was one-way traffic. Great to have the Italian stallion back enjoying his off season. The big one is next week against Darby so I hope everyone is planning a well rested bank holiday weekend. \nTeam: ID, CH, Nuge, Yoz, Will, Ted, Nibble, Pags\nGoals: Pags x2,  Gibb x2, Yoz x2, Ted x 2, Will x1, ID x1, OG x1","og":1,"id":"f61"},{"s":10,"d":"2026-05-12","us":2,"them":1,"opp":"Darby","by":"Craig Hodges","at":"2026-05-12","t":"5OH!5 2-1 Darby \n\n5OH!5's to lose? \n\nOne of the biggest games in the last few seasons produced a suitably cagey affair. The first half was a real battle, Nuge making a few huge saves before a rebound fell to Gibb who thundered home to make it 1-0 at the half. This, however, wasn't the last of Gibb's involvements in the game.\n\nWe started the second half brightly, hitting the post twice before Gibb inexplicably missed 3 chances from a combined 3 yards. Darby then scored from a cross-come-shot that was deflected cruelly past Nuge. Luckily, James Gibb was to have the last laugh. A kick in on the right hand side was hurriedly retrieved by Gibb who eyed Millsy at the far post, a slightly too high, but in his words, inch perfect ball was met by a salmon-like jump and 5OH!5 were 2-1 up. Some typically hairy moments were to follow but we held firm.\n\nIf you couldn't get any more good news, this game was actually filmed. Hold tight for the Gibb compilation.\n\n6 points clear, LFG. \n\nTeam: CH, ID, Nuge, Yom, will, Millsy, Gibb, Ted\nGoals: Gibb x1, Millsy x1","id":"f62"},{"s":10,"d":"2026-05-19","us":9,"them":3,"opp":"cold street","by":"Ian Donald","at":"2026-05-19","t":"19/05/26 - 9-3 W vs cold street \nVery silly 40 minutes of football. Not our finest performance as the opportunity to try and pack the stats took over and minimal football was played. But we are 8 from 8 with a goal difference of 50, with what looks like an 8-0 walkover next week, so who’s complaining? Not 100% on the goals so please shout if you think you got one - not you tho Gibb. \nTeam: ID, CH, Yoz, Will, DMac, Giblets, Kay, Pags\nGoals: Pags x5, Yoz x2, Will x2","id":"f63"},{"s":10,"d":"2026-06-02","us":2,"them":0,"opp":"Game of Stones","by":"Ian Donald","at":"2026-06-02","t":"02/06/26 2-0 vs Game of Stones\nVintage 5OH5. Backs against the wall. Pierre fouling at every opportunity. Two bits of quality for the 2 goals. What more can you ask for? 10 from 10 and we go marching on. \nTeam ID, CH, Burge, Pierre, Yoz, Hugh, Will, Giblets \nGoal: OG x1, Will x1","og":1,"note":"The report credits 1 own goal; the stats credit Ewan with 1. Totals match.","id":"f64"},{"s":10,"d":"2026-06-09","us":7,"them":2,"opp":"Robbens Referees","by":"Craig Hodges","at":"2026-06-09","t":"5OH!5 7-2 Robbens Referees\nHuge win which looks considerably easier on paper than it was. We turn up to see three new characters introducing themselves to the Robbens Referees regulars & after one had essentially walked past me in the first minute of the game & hit the post, it was clear it was going to be a long day for Cam and I. Luckily their 4 regulars were still their 4 regulars & we started having some joy up the other end of the pitch. Burg took our first incredibly well before Will and I both got on the scoresheet in the first half. They scored straight from kick off to make it 4-1 at HT, a wake up call that they really could score 3 in 3 minutes at any point. \n\nThe score going to 4-2 made bums twitch slightly but Pags and a Yozz double put the game to bed. Great work from Nuge who not only made some incredible saves but also got Cameron to play who did a superb job against maybe the best ringer we've seen on the Ark. luckily Robbens referees have avoided a cancelling as that was NOT the guy they were calling Drogba? \n\nVery important momentum to take from the type of game we typically would draw 5-5\n\nGoals: Yoz x2, Will x2, Burg x1, Pags x1, CH x1\nTeam: CH, Nuge, Yoz, Burg, Will, Gibb, Pags, Cameron","id":"f65"},{"s":10,"d":"2026-06-16","us":5,"them":2,"opp":"HMP Brixton","by":"Ian Donald","at":"2026-06-16","t":"16/06/26 - 5-2 win vs HMP Brixton\n12 from 12 and we go marching on. Nervy start after we go 1-0 down after 10 seconds when Nuge passes it straight to their striker on the edge of the area, but what followed was a very accomplished performance with hodges pulling the strings up top before needing to drop in to defence after every 3 sprints. Dropped points by both SMG and Darby leaves us 5 clear with 6 to play. No game next week to allow us all to cheer on the 3 lions. ID\nTeam: ID, CH, Nuge, Will, Pierre, Ted, Gibb, Cam\nGoals: CH x2, Ted x2, OG x1 (Gibb to pick up his dispute with the goal accreditation panel)","og":1,"note":"The report credits 1 own goal (Gibb disputes it); the stats credit Gibb with 1. Totals match.","id":"f66"},{"s":10,"d":"2026-06-30","us":11,"them":1,"opp":"CR7","by":"Craig Hodges","at":"2026-06-30","t":"5OH!5 11-1 CR7\n\nNot one for the neutrals as we go 13 for 13. 4-1 in at the break then turned \"a bit daft\" when they tried to meg everyone for the next 20 minutes. Every outfield player on the scoresheet which is a lovely confidence booster going into the run in.\n\nTeam: CH, ID, Nuge, Yozz, Will, Ted, Pierre, Millsy\nGoals: CH x1, ID x1, Yozz x2, Will x3, Millsy x2, Pierre x1, Ted x1","id":"f67"},{"s":10,"d":"2026-07-07","us":2,"them":4,"opp":"Darby","by":"Ian Donald","at":"2026-07-07","t":"07/07/27 - vs Darby 4-2 L\nThe boys have been through hell and back on the hottest Tuesday ever recorded at the ark against the reigning champs. Serious effort from the 6 that turned up, particularly when we found ourselves 1-0 up after 8 minutes, but we didn’t take our chances and everyone had literally nothing left to give in the second half. James Gibb needs to take some personal responsibility after begging for his “sick kiwi mate” to play and he turns up 28 minutes into the game after we’ve been run ragged and was closer to Gibb than Millsy - unsurprising he ignored my question earlier in the weeks . There’s no fun way to do the Splitwise on a day like today so please no complaints. Massive game next week to bounce back to reality. \nTeam: ID, CH, Nuge, Pierre, Gibb, Cam, AC, Gibb’s kiwi mate \nGoals: Cam, AC","id":"f68"},{"s":10,"d":"2026-07-14","us":5,"them":3,"opp":"SMG","by":"Craig Hodges","at":"2026-07-14","t":"5OH!5 5-3 SMG\n\nOne hand on the trophy? \n\nWe started against 6 which obviously meant we didn't score until near the end of the first half but were pegged back just before HT to go in at 1-1. The second half burst into life after SMG took a shock 2-1 lead, Millsy drew us level with a bergkamp-esque goal before Ian found himself in the right corner flag & scored from the tightest of angles with the keeper wiping him out in the process. SMG pegged us back again & with the game getting very scrappy & physical, Ted rounded the keeper for their big centre half to make an unbelievable save on the line. Fortunately for us, the ref decided he didn't want this game to be a draw and gave a pen & a sin bin. Yozz cooly converted before killing the game with a tidy finish. \n\n3 games to go, 5 clear.\n\nTeam: CH, ID, Nuge, Yozz, Hugh, Gibb, Ted, Millsy \nGoals: Yozz x3, ID x1, Millsy x1","id":"f69"},{"s":10,"d":"2026-07-21","us":11,"them":2,"opp":"cold street","by":"Ian Donald","at":"2026-07-21","t":"21/07/26 - 11-2 W vs cold street \nSilly game against a poor opposition resulted in a bit of a farce, but was good fun in the sun and a nice one for Kay to make his official debut as part of the group chat.\nI also believe that was captain leader legend C Hodges’ first ever hatty for the club as he continued to stack his stats this season. Good show from James Gibb in net. Next week is the big one to secure the first trophy in over a year. \nGoals CH x 3, Millsy x2, Yoz x2, Kayx2, ID x2 \nTeam: ID, CH, Yoz, Pierre, Millsy, Hugh, Gibb, Kay","id":"f70"},{"s":10,"d":"2026-07-28","us":6,"them":2,"opp":"SMG","by":"Ian Donald","at":"2026-07-28","t":"28/07/26 6-2 W vs SMG\nThere were no signs of this team being on the beach with the league sealed last week. A dominant performance, potentially helped with them turning up with 6 to start and us giving them Gibb, leading to us being 2-0 up after 5 mins when their 7th arrived. Great to give a new cap to a member of the family, a faster, tech-ier version of our French stallion. Topped up with a funny OG by their keeper as Will struck one and he parries it into the roof and then it hits in him in the back of the head and rolls in. \nGoals Kay x3, Pierre x1, Will x1, OG x1\nTeam: ID, Yoz, Nuge, Pierre, Will, Millsy, Nibble, Kay, Antoine","og":1,"id":"f71"},{"s":10,"d":"2026-08-04","us":3,"them":3,"opp":"La Massia","by":"Craig Hodges","at":"2026-08-04","t":"04/08/26 3-3 vs La Massia\n\nA brilliant performance with 7, no keeper & 2 ringers.\n\nWe were 1-0 down very early, I forgot that people could be behind me and their winger headed home, aided by Gibb throwing it in. We equalised scrappily off the roof before again going behind with some questionable keeping from Pierre. Not to be bogged down,  Will scored from a keeper spill and we went in wholly undersevedly at 2-2.\n\nWill dodged going in goal _again_ which turned out to be a masterstroke, Harding producing a performance for the ages between the sticks including a penalty save. \n\nWe went 3-2 down before equalising again through Kay at a corner, ensuring all 3 of our goals were incredibly ugly.\n\nYears of experience at the Ark did end up telling, with us taking it in turns to foul every 15 seconds, slowing the game down enough to get to the final whistle. \n\nA well earned 6 day break for us before we start again vs old foe SMG next Tuesday.\n\nTeam: CH, Gibb, Will, Kay, Pierre, Antoine, Harding \nGoals: CH x1, Will x1, Kay x1","id":"f72"},{"s":11,"d":"2026-08-11","us":5,"them":4,"opp":"SMG","by":"Ian Donald","at":"2026-08-11","t":"11/08/26 - 5-4 W vs SMG\nSMG swept aside for the third time in five weeks is a real statement to start the season. They had packed their team with the best side I’ve seen them put out in a long time but we always felt comfortable and lead for most of the game with a couple of well taken goals from both Yoz and Will, and then a Millsy “Gerrard 05 final moment” as self proclaimed to produce the winner. Great shift from both Millsy and Gibbo to stay on for another 40 mins of football after the rest of us went for a beer over the road. Sad to see HH have to head straight off to St Thomas’ hospital with a suspected broken finger but we have it on good authority they’re seeing him quickly.\nTeam: ID, CH, Yoz, Will, Millsy, Kay, Giblets, HH\nGoals: Yoz x2, Will x2, Millsy","id":"f73"},{"s":11,"d":"2026-08-18","us":7,"them":2,"opp":"La Masia","by":"Craig Hodges","at":"2026-08-18","t":"18/08/26 - 7-2W vs La Masia\n\nAnother statement win to start the season. It threatened to get close at 3-2 but we shut the door & tore them apart in the second half.\n\nMillsy covered every bobble of astro & finished the game by telling more talent than my little toe to say sorry to him following a petulant foul, which he did at full time. A real schooling.\n\nTeam: CH, ID, Yoz, Will, Millsy, Nuge, Gibb, Coops\nGoals: Millsy x3, Will x2, coops x2","id":"f74"},{"s":11,"d":"2026-08-25","us":3,"them":3,"opp":"game of stones","by":"Ian Donald","at":"2026-08-25","t":"25/08/26 3-3 vs game of stones\nNiggly day at the office with tempers flaring up at the ref after decisions didn’t quite go our way. Led for most the game and our very own giblets had a trade mark 3 swipes at the back post 1 yard out to make it 4-3 in the dying seconds but it was not to be. Still unbeaten and we go marching on. As you were, ID. \nGoals CH, Kay, Will\nTeam: ID, CH, Nuge, Will, Millsy, Kay, Ted, Gibbo","id":"f75"},{"s":11,"d":"2026-09-01","us":3,"them":0,"opp":"HMP","by":"Craig Hodges","at":"2026-09-01","t":"5oh!5 3-0 HMP \n\nA result and performance of old from the boys. HMP came into the game 3 from 3, full of confidence, particularly with last week's best player playing up top for them but we were up to the challenge. \n\nNuge made a couple of unreal saves early on, whilst our CB partnership had both played throw ins straight out for a corner & throw in before Mooresy opened the scoring on his return (shock). Millsy got our second in another typically industrious performance full of ball rolls.\n\nWe controlled the game well in the second half, ID dominating their striker. The third came in bizarre circumstances with Millsy stooping low from a Gibb corner for the ball to trickle in - a dying art. \n\nThe big ones don't stop there - Darby next week 7:10\n\nGoals: Millsy x2, Mooresy x1\nTeam: CH, ID, Nuge, Mooresy, Pierre, Yozz, Gibb, Millsy","id":"f76"},{"s":11,"d":"2026-09-08","us":4,"them":3,"opp":"Darby","by":"Craig Hodges","at":"2026-09-08","t":"5OH!5 4-3 Darby \n\nMade it hard for ourselves but a gritty win takes us clear at the top. 2-0 at HT through Yozz & a lovely turn & finish from Will, we thought we were comfortable. However, we fell foul to another brilliant ringer who made it 2-1 before an individual blunder from yours truly led to an equaliser. We pushed on with Will massaging his way past defenders to score a very well taken 3rd but again a defensive error led to a penalty to Darby & 3-3. A draw was looking likely before a scramble in the box was cleared by a defender straight into Pierre's arse & into the bottom corner.\n\nWe held on nicely to make it unbeaten in 5 having played the best 5 teams in the league. \n\nGoals: Will x2, Yozz x1, Pierre x1\nTeam: CH, ID, Nuge, Yozz, Will, Pierre, Millsy, Coops","id":"f77"},{"s":11,"d":"2026-09-15","us":3,"them":7,"opp":"CR7","by":"Ian Donald","at":"2026-09-15","t":"14/09/26 - 7-3 L vs CR7\nWell and truly put in our place with a sloppy performance which led to bottom of the league laughing at how on earth we were top of the league. Topped off by 3 of our 8 hobbling off injured at the end of the game. Dreams of an invincible season over is tough to take but gotta come back stronger next week. \nGoals: Yoz, Will, Pierre\nTeam: ID, CH, Pierre, Yoz, Will, Kay, Jardin, Giblets","id":"f78"},{"s":11,"d":"2026-09-22","us":7,"them":1,"opp":"Monks FC","by":"Ewan Harris","at":"2026-09-22","t":"21/09/26 - 7-1 W vs Monks FC\nYou fear for Monks FC, you really do. One of the most uninteresting games of 5Oh!5 football you’ll ever see. Remarkably professional performance from the boys as we went 3-0 up at HT and cantered home to 7-1. One flukey touch setting up the only blemish on the scoreboard. Aside from that, Gibb ranged from the sublime to the ridiculous with some close control and sarcastic passes in a 5 minute stretch followed by 35 minutes trying to recreate those highs.\nDarby did rally to beat CR7 while simultaneously losing their heads so I imagine we have work to do to get back to the top. \nGoals: Will 3, Yoz 2, Kay 1, Gibbo 1\nTeam: Nuge, Yoz, Pierre, Kay, Will, Gibb, Coooooop, Moorsey","id":"f79"},{"s":11,"d":"2026-09-29","us":4,"them":2,"opp":"Little Toe FC","by":"Ewan Harris","at":"2026-09-29","t":"28/09/2026 4-2W vs Little Toe FC\nIf 5Oh!5 fans were worried that the Hodges Donald-less era would usher in a new found professionalism, ruthlessly efficient performances sweeping past any Ark Globe Academy pretenders then fear no more.\nIt's 8:31pm and Kay has undone his laces to retie them in a desperate stalling tactic. Pags Will and I look at each other and debate the various merits and demerits of each 4 outfield player formation in a 7aside league. 1-2-1 was agreed and off we went. Quite incredibly, dare I say we dominated possession in a remarkably high quality rondo while waiting for reinforcements. Over the hill came the cavalry as Millsy arrives in tandem with Gibb. At that point beggars couldn't be choosers.\n\nBefore you knew it, Pags turns his man and the quorate 5Oh!5ers are up on the score sheet and level in head count. Verging on dreamland (big claim), we proceeded to faff around with it up top and allowed their keeper to have the evening of his life as 1-0 became 1-2 in a blink of an eye. Spreadsheet nerds calling for calm heads citing xG and field tilt but the ref obviously only deals in real goals. Kay grabs one before half time and a thriller is on at the Ark Globe.\n\nThe 2nd half started the way the 1st finished with 5Oh!5 snatching corners from the jaws of goals while also bouncing between assured and calamitous on the ball at the back.\n\nFinally, the ball is slid across the face and a great tackle denies us albeit a slide tackle and the ref points to the spot. This will settle nerves. Up steps the Stallion, heavy is the head that wears the pressure of upcoming nuptials and sure enough, a lacklustre penalty continued the keeper's career night.\n\nWith all the focus on MSN up top, it was Gibbiesta who ghosted in at the back post to edge us ahead once again. An effort going in off both posts making up for an open goal related calamity in the first half.\n\nShortly after, Pags hounds their keeper into an error and makes amends leaving the boys to coast home to a 4-2W. Never in doubt (apart from large periods of the game at 2-2).\n\nGoals: Pags 2, Kay 1, Gibb 1\nTeam: Pierre, DMac, Yoz, Pags, Will, Gibb, Millsy, Kay","id":"f80"},{"s":11,"d":"2026-10-06","us":5,"them":2,"opp":"SMG","by":"Ewan Harris","at":"2026-10-06","t":"6th October, W 5-2 vs SMG.\nNormal service is resumed as 5Oh!5 continue on their winning ways. A cagey first half with a few good stops from SMGs rotating cast of keepers kept it 1-1 at the break. Millsy being \"possessed by Pirlo\" a recurring highlight reel as he threaded needles only for the final touch to let us down.\n\nThe skipper keen for the boys to \"stay patient\" and how prescient he was. \nMillsy high press and finish for 2-1 within seconds of the restart. Will burries one bottom left for 3-1 and then Ian (yes Ian) caps off the quick fire treble for the boys with a strike threatening to take off remains of the Ark Globe nets to settle nerves.\n\nA few more scrappy salvos in an otherwise uneventful second half after this. I bagged one at the right end before losing one of the two men Gibb had left me to mark to peg us back to 5-2. Both Gibb and ID trying some audacious flicks and tricks that left something to be desired, guess they can try again next week!\n\nThe boys keep rolling with all eyes on the return fixture with Game of Stones set to decide this season's bragging rights.\n\nNo new injury concerns to report, always a positive.\n\nTeam: Nuge, Yoz, CH, ID, Will, Kay, Millsy, Ted\nGoals: Ted, Millsy, ID, Will, Yoz","id":"f81"},{"s":11,"d":"2026-10-13","us":1,"them":0,"opp":"Darby County","by":"Ewan Harris","at":"2026-10-13","t":"13th October, W 1-0 vs Darby County\n\nPick an old school 5Oh!5 squad, get an old school 5Oh!5 performance. \n\nIn a week where Reform promised to use lethal force in the channel, both sides at the Ark Globe showed prowess in sending things back from whence they came as a route one affair broke out in SE1. \n\nThe game started with a Gibb nutmeg straight off the bat and then quickly deteriorated. A loose ball, Yoz-Gibb-Yoz and its 1-0 to the good guys. \n\nI honestly couldn’t really tell you about any other chance apart from me missing a gilt edged opportunity to make it 2-0 with a few minutes to play and calm nerves. A sure fire sign that Darby would equalise you'd think but not to be, maybe we have changed after all?\n\nA few long shots here and scrappy build up there left Nick/Adam Federeci's goal largely unscathed and there was no Wharfie Time meltdown to come. It wasn't pretty but Champions grind out results and SMG topping Game of Stones mean we are 5 clear in our pursuit of back to back titles.\n\nGoals: Yoz\nSquad: CH, ID, Yoz, Millsy, DMac, Burg, Gibb, Garden, Nick","id":"f82"},{"s":11,"d":"2026-10-20","us":null,"them":null,"opp":null,"by":"Ian Donald","at":"2026-10-20","t":"","kind":"ff","note":"20 Oct 2026 – opponents forfeited, so no game was played.","id":"f83"},{"s":11,"d":"2026-10-27","us":6,"them":1,"opp":"HMP Brixton","by":"Ewan Harris","at":"2026-10-27","t":"27th October, W 6-1 vs HMP Brixton\n\nSorry was busy watching those Fleetwood boys stick it to the Gooners. Max Dowman seems like a nice, down to earth lad?\n\nThe 5Oh!5 men keep rolling. Undeterred by flakey Australians and the \"professional\" world stealing Kay and Burge away from us for the first 10, Will was slid in and we're 1-0 up against HMP+ringer. \n\nThe cavalry soon arrived as we doubled our lead through Will before Kay scores one of the great Ark Globe goals cutting in and whipping it top left bins. While this certainly suggested he wasn't under the influence, I'm struggling to imagine a recruitment \"work event\" which doesn't start with beers and end with bags and racially insensitive comments. Probably lucky we tore him away before it all got out of hand.\n\nWe huffed and puffed in the second half in classic 5Oh!5 ways, negging the HMP boys to get back in the game. Fortunately, Gibb found himself on the end of one nodding towards goal. Was it going in under its own power? I guess we will never know as I showed true poaching instincts to make sure. A product of this new online github stats era under codge06? Certainly seems that way. DMac got in on the act and one more for me meant we ran out comfortable 6-1 winners.\n\nWith the 2 points we're owed, we are champions. Without them, a win next week secures back to back titles. Clear your calendars.\n\nSquad: DMac, Craig, Ian, Yoz, Will, Burg, Gibb, Kay\nGoals: Will 2, Yoz 2, DMac, Kay","id":"f84"}];
let extra=[],UR=[],rf={},rEdit=null,rmsg='',oSel=null,tok=null,cfg=null,canW=false,tab='s',rep=null,sSel=null,pick=new Map(),edit=null,showAll=false,minApps=10,sortK='g',prof=null,msg='';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seasons(){const m=new Map();H.s.forEach(s=>m.set(s.n,{n:s.n,t:s.t&&Object.fromEntries(Object.entries(s.t).map(([k,v])=>[NM[k],v])),g:s.g.map(g=>({id:null,d:g[0],p:g[1].map(x=>[NM[x[0]],x[1]])}))}));
 extra.forEach(e=>{if(!m.has(e.season))m.set(e.season,{n:e.season,g:[]});if(m.get(e.season).g.some(g=>g.d==e.date))return;m.get(e.season).g.push({id:e.id,d:e.date,p:JSON.parse(e.pj)})});
 m.forEach(s=>s.g.sort((a,b)=>a.d.localeCompare(b.d)));return [...m.values()].sort((a,b)=>a.n-b.n)}
function stats(list){const r={};const g=n=>r[n]||(r[n]={n,a:0,g:0,as:0,hat:0,best:0});let games=0;
 list.forEach(s=>{games+=s.g.length;s.g.forEach(x=>x.p.forEach(([n,k])=>{const o=g(n);o.a++;o.g+=k;if(k>=3)o.hat++;o.best=Math.max(o.best,k)}));
  if(s.t)Object.entries(s.t).forEach(([n,v])=>{const o=g(n);o.g+=v[0];o.as+=v[1]})});
 const rows=Object.values(r);rows.forEach(o=>{o.r=o.a?o.g/o.a:0;o.p=games?o.a/games:0});return{rows,games}}
const f2=x=>x.toFixed(2),pc=x=>Math.round(x*100)+'%';
function bars(rows,k,fmt=x=>x,n=10){const t=[...rows].sort((a,b)=>b[k]-a[k]).slice(0,n),mx=Math.max(1e-9,...t.map(x=>x[k]));return t.map(x=>`<div class="bar"><span>${esc(x.n)}</span><i style="width:${x[k]/mx*100}%"></i><b>${fmt(x[k])}</b></div>`).join('')}
function line(vals,labels,h=130){const w=420,mx=Math.max(1,...vals),px=i=>20+i*(w-30)/Math.max(1,vals.length-1),py=v=>h-18-(v/mx)*(h-34);
 return `<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${vals.map((v,i)=>px(i)+','+py(v)).join(' ')}"/>${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3.5" fill="var(--ac2)"/><text x="${px(i)}" y="${py(v)-7}" text-anchor="middle">${v%1?v.toFixed(1):v}</text><text x="${px(i)}" y="${h-4}" text-anchor="middle">${labels[i]}</text>`).join('')}</svg>`}
function cols(vals,labels,h=130){const w=420,mx=Math.max(1,...vals),bw=(w-20)/vals.length;return `<svg viewBox="0 0 ${w} ${h}" width="100%">${vals.map((v,i)=>{const bh=v/mx*(h-34);return `<rect x="${12+i*bw}" y="${h-18-bh}" width="${bw-6}" height="${bh}" rx="3" fill="var(--ac)"/><text x="${12+i*bw+(bw-6)/2}" y="${h-21-bh}" text-anchor="middle">${v}</text><text x="${12+i*bw+(bw-6)/2}" y="${h-5}" text-anchor="middle">${labels[i]}</text>`}).join('')}</svg>`}
function table(rows,single,games){const ks=[['n','Player'],['a','Apps'],['g','Goals'],['r','G/Game']].concat(single?[['p','Att %']]:[['hat','3+ ⚽'],['best','Best']]);
 const t=[...rows].sort((a,b)=>sortK=='n'?a.n.localeCompare(b.n):b[sortK]-a[sortK]||b.g-a.g);
 return `<div class="wrap"><table><tr>${ks.map(([k,l])=>`<th onclick="sortK='${k}';draw()">${l}${sortK==k?' ▾':''}</th>`).join('')}</tr>${t.map(o=>`<tr><td>${esc(o.n)}</td><td>${o.a}</td><td><b>${o.g}</b></td><td>${f2(o.r)}</td>${single?`<td>${pc(o.p)}</td>`:`<td>${o.hat}</td><td>${o.best||'–'}</td>`}</tr>`).join('')}</table></div>`}
function kpi(a,b){return `<div class="kpi"><b>${a}</b><span>${b}</span></div>`}
function matchDay(){if(!canW)return lockView();const ss=seasons(),cur=ss[ss.length-1].n,sel=+(sSel??cur);const st=stats(ss.slice(-2));
 const all=stats(ss).rows.map(o=>o.n),act=new Set(ss.slice(-2).flatMap(s=>s.g.flatMap(g=>g.p.map(p=>p[0]))));
 const names=(showAll?all:all.filter(n=>act.has(n)||pick.has(n))).sort((a,b)=>a.localeCompare(b)),gl=[...pick.values()].reduce((a,b)=>a+b,0);
 const opts=ss.map(s=>s.n).concat([ss[ss.length-1].n+1]).map(n=>`<option value="${n}" ${n==sel?'selected':''}>Season ${n}${n>cur?' (new)':''}</option>`).join('');
 const sg=(ss.find(s=>s.n==sel)?.g||[]).slice().reverse();

 <h3>Tick who played · use ± for goals</h3><div class="roster">${names.map(n=>{const on=pick.has(n);return `<div class="pl ${on?'on':''}" onclick="tg(${JSON.stringify(n).replace(/"/g,'&quot;')})"><input type="checkbox" ${on?'checked':''} tabindex="-1"><span class="n">${esc(n)}</span><span class="st" onclick="event.stopPropagation()"><button onclick='gg(${JSON.stringify(n).replace(/'/g,'&#39;').replace(/"/g,"&quot;")},-1)'>−</button><b>${pick.get(n)||0}</b><button onclick='gg(${JSON.stringify(n).replace(/'/g,'&#39;').replace(/"/g,"&quot;")},1)'>+</button></span></div>`}).join('')}</div>

 ${reportCard(sel,ss)}
